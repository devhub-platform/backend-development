name: Laravel CI/CD - AWS Elastic Beanstalk

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ELASTIC_BEANSTALK_NAME: devhub
  ELASTIC_BEANSTALK_ENV_NAME: devhub-env
  AWS_REGION: us-east-1
  S3_BUCKET: elasticbeanstalk-us-east-1-447051187420

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, curl, zip

      - name: Install Composer dependencies (Production)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment package
        run: |
          zip -r ${{ github.run_id }}.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "*.env*" \
            -x "phpunit.xml" \
            -x "phpstan.neon" \
            -x ".github/*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-files
          path: ${{ github.run_id }}.zip
          retention-days: 5

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-files

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          aws-access-key-id: AKIAWQFSTYTOMJSWHL4J
          aws-secret-access-key: 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

      - name: Upload to S3
        run: |
          aws s3 cp "${{ github.run_id }}.zip" "s3://devhub-storage-s3/artifact/devhub-app/${{ github.run_id }}.zip"

      - name: Create Elastic Beanstalk Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name devhub \
            --version-label "${{ github.run_id }}" \
            --description "Deployment from GitHub Actions - Commit: ${{ github.sha }}" \
            --source-bundle S3Bucket="devhub-storage-s3",S3Key="artifact/devhub-app/${{ github.run_id }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name devhub \
            --environment-name Devhub-env \
            --version-label "${{ github.run_id }}"

      - name: Wait for Environment Update
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name devhub \
            --environment-name Devhub-env

      - name: Deployment Success
        run: echo "Successfully deployed to AWS Elastic Beanstalk!"
