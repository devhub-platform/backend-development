# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Laravel app to Azure Web App - devhub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, intl, bcmath, zip
          coverage: none

      - name: Validate composer files
        run: |
          test -f composer.json
          test -f composer.lock

      - name: Configure Nova credentials
        if: ${{ secrets.NOVA_USER != '' && secrets.NOVA_KEY != '' }}
        run: |
          composer config http-basic.repo.nova.laravel.com "${{ secrets.NOVA_USER }}" "${{ secrets.NOVA_KEY }}"

      - name: Install dependencies
        env:
          # CI-only defaults so package discovery does not require real Pusher secrets.
          BROADCAST_CONNECTION: log
          BROADCAST_DRIVER: log
          PUSHER_APP_ID: ci
          PUSHER_APP_KEY: ci
          PUSHER_APP_SECRET: ci
          PUSHER_APP_CLUSTER: mt1
        run: |
          php --version
          composer --version
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Zip the application files
        run: |
          zip -r release.zip . -x ".git/*" "node_modules/*" "tests/*" "storage/logs/*" ".github/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'devhub'
          slot-name: 'Production'
          publish-profile: ${{ secrets.publishprofilesecretname }}
          package: release.zip
