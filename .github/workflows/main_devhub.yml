# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - devhub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        env:
          # CI-only defaults so package discovery does not require real Pusher secrets.
          BROADCAST_CONNECTION: log
          BROADCAST_DRIVER: log
          PUSHER_APP_ID: ci
          PUSHER_APP_KEY: ci
          PUSHER_APP_SECRET: ci
          PUSHER_APP_CLUSTER: mt1
        run: composer validate --no-check-publish && composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Create deploy package
        run: zip -r release.zip . -x ".git/*" "node_modules/*" "tests/*" "storage/logs/*" ".github/*"


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E3A9AAE19CE947F998018898FFF60798 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5A10A7BA2DBC473B84D069D5CE329A9D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF0E847A537E455DBF23A62DA5678E42 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'devhub'
          slot-name: 'Production'
          package: release.zip
