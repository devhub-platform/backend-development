name: Build and deploy PHP app to Azure Web App - devhub community

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NPM dependencies
        run: npm install

      - name: Clean development files
        run: |
          rm -f public/hot
          rm -rf storage/framework/cache/*
          rm -rf storage/framework/views/*
          rm -rf bootstrap/cache/*

      - name: Build frontend
        run: npm run build

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        env:
          # CI-only defaults so package discovery does not require real Pusher secrets.
          BROADCAST_CONNECTION: log
          BROADCAST_DRIVER: log
          PUSHER_APP_ID: ci
          PUSHER_APP_KEY: ci
          PUSHER_APP_SECRET: ci
          PUSHER_APP_CLUSTER: mt1
        run: composer validate --no-check-publish && composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Create deploy package
        run: |
          # Remove non-essential files first
          zip -r release.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" \
            "storage/framework/*" "bootstrap/cache/*" \
            "*.env*" "public/hot" "public/storage" \
            ".env" ".env.backup" ".env.production"

          # Then add public/build contents at zip root level
          if [ -d "public/build" ]; then
            echo "Adding public/build to zip at root level..."
            cd public/build
            zip -r ../../release.zip . -x "*/.git/*"
            cd ../..
          else
            echo "public/build folder not found after npm run build"
            exit 1
          fi


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: php-app
          path: .

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E3A9AAE19CE947F998018898FFF60798 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5A10A7BA2DBC473B84D069D5CE329A9D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF0E847A537E455DBF23A62DA5678E42 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'devhub'
          slot-name: 'Production'
          package: release.zip
